name: Build PER CI image
description: Resolves or builds the repo Dockerfile
outputs:
  image:
    description: Fully qualified image reference (name:tag)
    value: ${{ steps.check.outputs.image }}
runs:
  using: composite
  steps:
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: check
      shell: bash
      run: |
        REPO="ghcr.io/purdueelectricracing/monorepo/per-firmware"
        IMAGE="$REPO:deps-${{ hashFiles('Dockerfile', 'requirements.txt') }}"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.check.outputs.exists != 'true'
      uses: docker/setup-buildx-action@v4

    - if: steps.check.outputs.exists != 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.check.outputs.image }}
        cache-from: type=gha,scope=per-firmware
        cache-to: type=gha,mode=max,scope=per-firmware

    - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: bash
      run: |
        docker buildx imagetools create \
          -t ghcr.io/purdueelectricracing/monorepo/per-firmware:latest \
          "${{ steps.check.outputs.image }}"
