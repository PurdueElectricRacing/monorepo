name: Build PER CI image
description: Resolves or builds the repo Dockerfile and pushes it to GHCR only when dependencies change
outputs:
  image:
    description: Fully qualified image reference (name:tag)
    value: ${{ steps.resolve.outputs.image }}
runs:
  using: composite
  steps:
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - id: resolve
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        GITHUB_REF: ${{ github.ref }}
      run: "${{ github.action_path }}/resolve_image.sh"

    - name: Set up Docker Buildx
      if: steps.resolve.outputs.should_build == 'true'
      uses: docker/setup-buildx-action@v4

    - name: Build and push CI image
      if: steps.resolve.outputs.should_build == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.resolve.outputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha,scope=per-firmware
        cache-to: type=gha,mode=max,scope=per-firmware
