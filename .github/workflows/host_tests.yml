name: Host Tests

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  unit_tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, test, and generate coverage
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: Ninja
        run: python3 tests/build_tests.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: host-test-coverage
          path: firmware/build/host-tests/coverage
          if-no-files-found: error
          retention-days: 14
