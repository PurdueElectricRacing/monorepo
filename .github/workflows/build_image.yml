name: Build Image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/per-image
