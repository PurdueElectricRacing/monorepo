name: Build DAQ Workspace

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - 'daq/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'generators/**'
      - '.github/workflows/build_daq.yml'
  merge_group:
    types: [checks_requested]
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.built.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: built
        uses: ./.github/actions/docker_image

  build:
    name: Build DAQ Workspace
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check formatting
        working-directory: daq
        run: cargo fmt --all --check

      - name: Verify checked-in diesel schema
        working-directory: daq/daqcloud
        shell: bash
        run: |
          database_dir="$(mktemp -d)"
          trap 'rm -rf "$database_dir"' EXIT
          export DATABASE_URL="$database_dir/daqcloud.db"
          diesel migration run
          git diff --exit-code -- src/db/schema.rs

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daq -> target
          key: ${{ hashFiles('Dockerfile') }}

      - name: Generate firmware artifacts and SuperDBC schema
        run: python3 generators/generate.py

      - name: Regenerate and verify SuperDBC models
        working-directory: daq
        run: |
          cargo check -p daqcore --locked
          git diff --exit-code -- daqcore/src/superdbc/model_generated.rs

      - name: Build DAQ workspace
        working-directory: daq
        run: cargo build --workspace --all-targets --locked

      - name: Test DAQ workspace
        working-directory: daq
        run: cargo test --workspace --all-targets --locked

  clippy:
    name: Clippy (DAQ)
    needs: [image, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daq -> target
          key: ${{ hashFiles('Dockerfile') }}

      - name: Check Clippy
        working-directory: daq
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
