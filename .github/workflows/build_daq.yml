name: Build DAQ Workspace

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  clippy:
    name: Clippy (DAQ)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clippy
        run: rustup component add clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            daq/target
          key: ${{ runner.os }}-clippy-DAQ-${{ hashFiles('daq/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-DAQ-

      # Save the outcome so PR reporting runs before the job fails.
      - name: Check Clippy
        id: clippy
        working-directory: daq
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        continue-on-error: true

      # Fork PR tokens cannot post reviews; the strict check still runs for them.
      - name: Comment on Clippy findings
        if: >-
          ${{ !cancelled() && steps.clippy.outcome == 'failure' &&
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        uses: giraffate/clippy-action@13b9d32482f25d29ead141b79e7e04e7900281e0 # v1
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workdir: daq
          clippy_flags: --workspace --all-targets --all-features --locked -- -D warnings
          reporter: github-pr-review
          filter_mode: diff_context
          level: error

      - name: Enforce Clippy result
        if: ${{ !cancelled() && steps.clippy.outcome == 'failure' }}
        run: |
          echo "::error::Clippy failed. See the Check Clippy step above for diagnostics."
          exit 1

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cargo Format
        working-directory: daq
        run: cargo fmt --all --check

  build:
    name: Build DAQ Workspace
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            daq/target
          key: ${{ runner.os }}-daq-${{ hashFiles('daq/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-daq-

      - name: Build DAQ workspace
        working-directory: daq
        run: cargo build --workspace --all-targets --locked

      - name: Test DAQ workspace
        working-directory: daq
        run: cargo test --workspace --all-targets --locked
