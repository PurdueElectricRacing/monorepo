name: Build DAQ Workspace

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cargo Format
        working-directory: daq
        run: cargo fmt --all --check

  build:
    name: Build DAQ Workspace
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            daq/target
          key: ${{ runner.os }}-daq-${{ hashFiles('daq/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-daq-

      - name: Build DAQ workspace
        working-directory: daq
        run: cargo build --workspace --all-targets --locked

      - name: Test DAQ workspace
        working-directory: daq
        run: cargo test --workspace --all-features --all-targets --locked

      - name: Show compiler warnings
        working-directory: daq
        run: |
          echo "Compiler warnings:"
          cargo check --workspace --all-targets --locked --message-format short
        continue-on-error: true

  core-features:
    name: Headless core (${{ matrix.features || 'minimal' }})
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest
    strategy:
      matrix:
        features: ["", "serial", "udp", "simulated", "loopback", "hil", "firmware", "formatting", "serial,udp,simulated,loopback,hil,firmware,formatting"]
    steps:
      - uses: actions/checkout@v7
      - name: Test standalone core
        working-directory: daq
        run: cargo test -p daqcore --no-default-features --features "${{ matrix.features }}" --all-targets --locked
      - name: Check ownership boundaries
        if: matrix.features == ''
        run: python3 daq/check_boundaries.py
