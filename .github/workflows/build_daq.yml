name: Build DAQ Workspace

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.built.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: built
        uses: ./.github/actions/per-image

  daqcloud_schema:
    name: Check generated diesel schema
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Regenerate schema from migrations and verify checked-in schema
        working-directory: daq/daqcloud
        shell: bash
        run: |
          database_dir="$(mktemp -d)"
          trap 'rm -rf "$database_dir"' EXIT
          export DATABASE_URL="$database_dir/daqcloud.db"
          diesel migration run
          git diff --exit-code -- src/db/schema.rs

  superdbc_models:
    name: Check generated SuperDBC models
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate firmware artifacts and SuperDBC schema
        run: python3 generators/generate.py

      - name: Regenerate SuperDBC models
        working-directory: daq
        run: cargo check -p daqcore --locked

      - name: Verify checked-in models are current
        run: git diff --exit-code -- daq/daqcore/src/superdbc/model_generated.rs

  build:
    name: Build DAQ Workspace
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            daq/target
          key: ${{ runner.os }}-daq-${{ hashFiles('daq/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-daq-

      - name: Build DAQ workspace
        working-directory: daq
        run: cargo build --workspace --all-targets --locked

      - name: Test DAQ workspace
        working-directory: daq
        run: cargo test --workspace --all-targets --locked

  fmt:
    name: Check formatting
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cargo Format
        working-directory: daq
        run: cargo fmt --all --check

  clippy:
    name: Clippy (DAQ)
    needs: [image, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            daq/target
          key: ${{ runner.os }}-clippy-DAQ-${{ hashFiles('daq/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-DAQ-

      - name: Check Clippy
        working-directory: daq
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
