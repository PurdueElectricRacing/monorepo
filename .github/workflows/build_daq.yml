name: Build DAQ Workspace

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.built.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: built
        uses: ./.github/actions/per-image

  daqcloud_schema:
    name: Check generated diesel schema
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Diesel CLI
        id: diesel_cli_cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/diesel-cli
          key: ${{ runner.os }}-${{ runner.arch }}-diesel-cli-2.3.3-sqlite-bundled-v1

      - name: Install Diesel CLI
        if: steps.diesel_cli_cache.outputs.cache-hit != 'true'
        run: >-
          cargo install diesel_cli --version 2.3.3 --locked
          --no-default-features --features sqlite-bundled
          --root "$RUNNER_TEMP/diesel-cli"

      - name: Regenerate schema from migrations and verify checked-in schema
        working-directory: daq/daqcloud
        shell: bash
        run: |
          database_dir="$(mktemp -d)"
          trap 'rm -rf "$database_dir"' EXIT
          export DATABASE_URL="$database_dir/daqcloud.db"
          "$RUNNER_TEMP/diesel-cli/bin/diesel" migration run
          git diff --exit-code -- src/db/schema.rs

  superdbc_models:
    name: Check generated SuperDBC models
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate firmware artifacts and SuperDBC schema
        run: python3 generators/generate.py

      - name: Regenerate SuperDBC models
        working-directory: daq
        run: cargo check -p daqcore --locked

      - name: Verify checked-in models are current
        run: git diff --exit-code -- daq/daqcore/src/superdbc/model_generated.rs

  build:
    name: Build DAQ Workspace
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            daq/target
          key: ${{ runner.os }}-daq-${{ hashFiles('daq/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-daq-

      - name: Build DAQ workspace
        working-directory: daq
        run: cargo build --workspace --all-targets --locked

      - name: Test DAQ workspace
        working-directory: daq
        run: cargo test --workspace --all-targets --locked

  fmt:
    name: Check formatting
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cargo Format
        working-directory: daq
        run: cargo fmt --all --check

  clippy:
    name: Clippy (DAQ)
    needs: [image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Clippy
        run: rustup component add clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            daq/target
          key: ${{ runner.os }}-clippy-DAQ-${{ hashFiles('daq/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-DAQ-

      - name: Check Clippy
        working-directory: daq
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
