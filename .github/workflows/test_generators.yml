name: Generator Tests

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run generator tests
        run: python3 -m pytest generators -q
