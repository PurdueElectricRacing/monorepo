name: Build Firmware

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.built.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: built
        uses: ./.github/actions/per-image

  firmware_build:
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with: 
          submodules: recursive

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Get short hash
        id: git_info
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Build firmware
        run: python3 firmware/build_firmware.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.git_info.outputs.branch }}-${{ steps.git_info.outputs.short_hash }}
          path: |
            firmware/output/**/*.elf
            firmware/output/**/*.hex
            firmware/output/**/*.tar.gz
            superdbc/superdbc_*.json
            superdbc/superdbc.schema.json
          retention-days: ${{ github.ref == 'refs/heads/master' && 90 || 7 }}

  cppcheck:
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run cppcheck
        run: python3 firmware/check_firmware.py
