name: Build Firmware

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  firmware_build:
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with: 
          submodules: recursive

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Get short hash
        id: git_info
        run: |
          SHORT_HASH=$(git rev-parse --short HEAD)
          echo "short_hash=$SHORT_HASH" >> $GITHUB_OUTPUT
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Build firmware
        run: python3 per_build.py firmware --package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.git_info.outputs.branch }}-${{ steps.git_info.outputs.short_hash }}
          path: |
            firmware/output/**/*.elf
            firmware/output/**/*.hex
            firmware/output/**/*.tar.gz
            firmware/can_library/dbc/*.dbc
          retention-days: ${{ github.ref == 'refs/heads/master' && 90 || 7 }}

  cppcheck:
        needs: firmware_build
        runs-on: ubuntu-latest
        container:
            image: irvingywang/per-firmware:latest
            
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Fix git ownership
              run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

            - name: Run cppcheck
              run: python3 per_build.py firmware --check
              
