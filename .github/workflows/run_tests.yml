name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  fil_tests:
    name: FIL PGO and PER integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install FIL PGO tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make clang llvm libclang-rt-dev
          clang++ --version
          llvm-profdata --version

      - name: Build vehicle firmware
        run: python3 firmware/build_firmware.py

      - name: Generate FIL configs
        run: python3 generators/generate.py

      - name: Build FIL with PGO and run integration tests
        env:
          PGO_CXX: clang++
          LLVM_PROFDATA: llvm-profdata
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: python3 tests/fil/run_tests.py --build

  unit_tests:
    name: Generator and firmware unit tests
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test, and generate coverage
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: Ninja
        run: python3 tests/run_tests.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: host-test-coverage
          path: firmware/build/host-tests/coverage
          if-no-files-found: error
          retention-days: 14
