name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit_tests:
    name: Generator and firmware unit tests
    runs-on: ubuntu-latest
    container:
      image: irvingywang/per-firmware:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test, and generate coverage
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: Ninja
        run: python3 tests/run_tests.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: host-test-coverage
          path: firmware/build/host-tests/coverage
          if-no-files-found: error
          retention-days: 14
