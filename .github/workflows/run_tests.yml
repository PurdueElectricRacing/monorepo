name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  merge_group:
    types: [checks_requested]
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.built.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: built
        uses: ./.github/actions/docker_image

  fil_tests:
    name: FIL and PER integration tests
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build vehicle firmware
        run: python3 firmware/build_firmware.py

      - name: Download FIL release binary
        run: |
          # Keep this release tag and checksum in sync with the FIL submodule.
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/fil" \
            https://github.com/ronakpjain/fil/releases/download/v0.1.0/fil-linux-x86_64
          printf '%s  %s\n' '55de4374e7d5d73eea86e415d60c497e788b375544cab5be79cd602311ccd5d7' "$RUNNER_TEMP/fil" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fil"

      - name: Run FIL integration tests
        run: python3 tests/fil/run_tests.py --fil "$RUNNER_TEMP/fil"

  unit_tests:
    name: Generator and firmware unit tests
    needs: [image]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image || 'ghcr.io/purdueelectricracing/monorepo/per-firmware:latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test, and generate coverage
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: Ninja
        run: python3 tests/run_tests.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: host-test-coverage
          path: firmware/build/host-tests/coverage
          if-no-files-found: error
          retention-days: 14
