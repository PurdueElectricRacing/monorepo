name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.built.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: built
        uses: ./.github/actions/per-image

  fil_tests:
    name: FIL PGO and PER integration tests
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify FIL PGO tools
        run: |
          clang++ --version
          llvm-profdata --version

      - name: Build vehicle firmware
        run: python3 firmware/build_firmware.py

      - name: Build FIL with PGO and run integration tests
        env:
          PGO_CXX: clang++
          LLVM_PROFDATA: llvm-profdata
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: python3 tests/fil/run_tests.py --build

  unit_tests:
    name: Generator and firmware unit tests
    needs: [image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, test, and generate coverage
        env:
          CC: gcc
          CXX: g++
          CMAKE_GENERATOR: Ninja
        run: python3 tests/run_tests.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: host-test-coverage
          path: firmware/build/host-tests/coverage
          if-no-files-found: error
          retention-days: 14
