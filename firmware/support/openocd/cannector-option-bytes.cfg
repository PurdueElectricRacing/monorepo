# Provision CANnector to boot from main flash independently of the BOOT0 pin.
source [find interface/stlink.cfg]
source [find target/stm32g4x.cfg]

init
reset halt

# ! uses the shared L4x driver, which is compatible with G4x
# FLASH_OPTR offset 0x20, flash bank 0.
# Mask only nSWBOOT0 (bit 26) and nBOOT0 (bit 27), preserving other options.
# nSWBOOT0 = 0: use the option bit instead of the BOOT0 pin.
# nBOOT0 = 1: select main flash.
stm32l4x option_read 0 0x20
stm32l4x option_write 0 0x20 0x08000000 0x0C000000
stm32l4x option_read 0 0x20

# Apply the persistent option bytes and reset the MCU.
stm32l4x option_load 0
shutdown
