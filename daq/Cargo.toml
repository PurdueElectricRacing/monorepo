[workspace]
resolver = "3"
members = [
    "daqapp",
    "daqcore",
    "daqcli",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
daqcore = { path = "daqcore" }
env_logger = "0.11.10"

can_decode = "0.7.2"
can-dbc = "9.0.0"
chrono = "0.4.44"
log = "0.4.29"
bytemuck = "1.25.0"
csv = "1.4.0"