[workspace]
resolver = "3"
members = [
    "daqapp",
    "daqcore",
    "daqcli",
    "daqcloud",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
daqcore = { path = "daqcore" }

env_logger = "0.11.10"
chrono = "0.4.44"
log = "0.4.29"
bytemuck = { version = "1.25.0", features = ["derive"] }
csv = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.8.1"
slcan = { git = "https://github.com/LelsersLasers/slcan", rev = "a8c751c6695532a9ea95d62114b30fd18cf89697", features = ["sync"] }
